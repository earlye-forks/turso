name: "Pull Request Labeler"
on:
  pull_request_target:
    branches:
      - main

jobs:
  labeler:
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
      pull-requests: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/labeler@v5
